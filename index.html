<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Opening payment</title>
<style>
  :root { --bg: #f4f6f8; --fg: #1d2733; --muted: #5b6672; --btn: #0a7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161b; --fg: #e8edf2; --muted: #9aa5b1; --btn: #12a36a; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
         font: 17px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
  p { color: var(--muted); }
  button { margin-top: 16px; padding: 14px 28px; border: 0; border-radius: 10px; background: var(--btn);
           color: #fff; font-size: 17px; }
</style>
</head>
<body>
<h2>Opening the bank payment page…</h2>
<p id="note">This only forwards the payment the server prepared. Nothing is stored here.</p>
<form id="pay" method="post">
  <input type="hidden" name="encRequest">
  <input type="hidden" name="access_code">
  <button type="submit">Continue to payment</button>
</form>
<script>
  // The data comes in the #fragment, which the browser never sends to this host.
  const data = new URLSearchParams(location.hash.slice(1));
  const target = data.get("u") || "";
  // Only Bank Muscat SmartPay, the gateway the airport site uses (seen 11-Oct-2026).
  const allowed = target.startsWith("https://smartpaytrns.bankmuscat.com/");
  const form = document.getElementById("pay");
  if (!allowed || !data.get("e") || !data.get("a")) {
    document.querySelector("h2").textContent = "This payment link is incomplete or not for the bank gateway.";
    form.hidden = true;
  } else {
    form.action = target;
    form.encRequest.value = data.get("e");
    form.access_code.value = data.get("a");
    history.replaceState(null, "", location.pathname);  // keep the order data out of the history
    form.submit();
  }
</script>
</body>
</html>
